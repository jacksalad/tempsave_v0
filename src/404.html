<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 Not Found</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #333333;
            font: 14px/1.7 Consolas, Menlo, "Courier New", monospace;
        }
        .wrap {
            max-width: 640px;
            margin: 0 auto;
            padding: 4em 1.5em;
        }
        h1 {
            font-size: 1.6em;
            font-weight: normal;
            margin: 0 0 0.6em;
        }
        p {
            margin: 0 0 0.6em;
        }
        hr {
            border: 0;
            border-top: 1px solid #dddddd;
            margin: 1.6em 0;
        }
        .addr {
            color: #888888;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>Not Found</h1>
    <p>The requested URL was not found on this server.</p>
    <hr>
    <p class="addr">Apache/2.4.62 (Debian) Server at localhost Port 80</p>
</div>
</body>
</html>
